name: analysis tests

on:
  push:
    paths:
      - "analysis/**"
      - ".github/workflows/analysis-tests.yml"
  pull_request:
    paths:
      - "analysis/**"
      - ".github/workflows/analysis-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      # Synthetic signals only: no PhysioNet downloads and no personal data in CI.
      - name: Test
        run: python -m pytest -q tests
