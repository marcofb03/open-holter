name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release on tags
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="0.1.0-dev+${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: Build debug APK
        run: >
          ./gradlew --stacktrace :app:assembleDebug
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      # A properly signed release APK on main and on tags, only when the keystore secrets
      # exist (see android/README.md, "Release signing"). Every such build has the same
      # key, so it installs over the previous one and keeps the recordings.
      - name: Build signed release APK
        if: >
          github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew --stacktrace :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/open-holter-${{ steps.version.outputs.name }}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/open-holter-${{ steps.version.outputs.name }}.apk"
          fi
          ls -l dist

      # Rolling pre-release "nightly": the newest signed build of main. The app's
      # "Check for updates" reads version.json from it (see android/README.md, "Updates").
      - name: Publish nightly release
        if: >
          github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true' &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          asset="open-holter-${VERSION_CODE}.apk"
          mkdir -p nightly
          cp "dist/open-holter-${VERSION_NAME}.apk" "nightly/$asset"
          sha=$(sha256sum "nightly/$asset" | cut -d' ' -f1)
          size=$(stat -c %s "nightly/$asset")
          printf '{"versionCode": %s, "versionName": "%s", "commit": "%s", "apk": "%s", "sha256": "%s", "size": %s}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA" "$asset" "$sha" "$size" > nightly/version.json
          cat nightly/version.json
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          notes="Newest signed build of main: ${VERSION_NAME} (versionCode ${VERSION_CODE}). Install it from the app (About → Check for updates). Not a medical device."
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly (main)" --notes "$notes"
          # The APK goes up before version.json, so version.json never points to a missing file.
          gh release upload nightly "nightly/$asset" --clobber
          gh release upload nightly nightly/version.json --clobber
          gh release edit nightly --prerelease --notes "$notes"
          gh release view nightly --json assets --jq '.assets[].name' \
            | grep -E '^open-holter-[0-9]+\.apk$' | grep -vx "$asset" \
            | while read -r old; do gh release delete-asset nightly "$old" -y; done

      - uses: actions/upload-artifact@v4
        with:
          name: open-holter-apk
          path: android/dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/*.apk
          generate_release_notes: true
